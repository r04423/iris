<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="144" viewBox="0 0 320 144" role="img" aria-labelledby="title description">
  <title id="title">Iris</title>
  <desc id="description">The Iris aperture emblem beside the Iris wordmark, on a transparent background.</desc>
  <defs>
