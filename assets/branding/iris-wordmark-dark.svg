      <stop offset="1" stop-color="#bb8dbd"/>
    </linearGradient>
    <linearGradient id="spectrum-6" gradientUnits="userSpaceOnUse" x1="260" y1="86" x2="318" y2="199">
      <stop stop-color="#ffe0eb"/>
      <stop offset=".48" stop-color="#e6a4bd"/>
      <stop offset="1" stop-color="#e4a08f"/>
